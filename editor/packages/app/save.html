<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Drakan Save Editor</title>
        <link rel="icon" href="data:," />
        <script>
            try {
                document.documentElement.dataset.theme =
                    localStorage.getItem('drakan-editor:theme') === 'light' ? 'light' : 'dark';
            } catch (e) {
                document.documentElement.dataset.theme = 'dark';
            }
        </script>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body class="save-app">
        <main id="save-main" data-dd-host></main>
        <input id="iso-input" type="file" accept=".iso,.bin,.img" hidden />
        <div id="drop" hidden>Drop a save (.rsg) or your disc image</div>
        <script type="module" src="/src/saveapp.ts"></script>
    </body>
</html>
