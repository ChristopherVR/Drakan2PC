[package]
name = "drakan-editor-desktop"
version = "0.1.0"
description = "Desktop shell of the Drakan level and save editor"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "drakan_editor_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
