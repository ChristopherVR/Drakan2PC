; Multiplayer maps ("arenas"): deathmatch / team deathmatch on the terrain of a campaign level, the way Drakan: Order of
; the Flame had dedicated multiplayer maps. The campaign's creatures, NPCs, cut scenes, level exits and quest objects are
; removed when the match level is up; players spawn at the `spawn` points, the `pickup` entries respawn after a delay,
; nothing can be saved. Format and rules: docs/reference/netcode.md "Multiplayer maps".
;
; This file is compiled into the game as the default list. A player's own `mp_maps.ini` next to the game, and the
; `maps/*.ini` files of mod packs, use the same format; an arena id defined again replaces the earlier one.
; Only numbers and names live here, no game data. Positions are the level's world units (x, y = up, z), taken from the
; level's own object list (analysis/scripts/arena_candidates.py) and checked in game with DRAKAN_ARENA_TOUR.
;
;   [arena <id>]          short unique id (letters, digits, - and _)
;   name = ...            display name; also what the match config carries
;   level = ...           campaign level title (or a mod pack level) whose terrain it uses
;   description = ...     one line for the menu
;   modes = dm, tdm       supported modes (default both)
;   players = N           maximum players, 2..16
;   health = N            start health bar in server points (default 100)
;   bounds = x0 z0 x1 z1  playable rectangle; leaving it for a few seconds sends the player back to a spawn point
;   loadout = 0x... ...   resource ids every player gets at the start (optional); keep to weapons a level 1 Rynn may use (the dagger)
;   preview = x y z [yaw [pitch]]   where the menu picture of the map is taken from (degrees; pitch > 0 looks up): the game
;                         stands a player here during the first match on the map and saves the window image to the user's data
;                         folder (previews/ under %LOCALAPPDATA%/Drakan2PC, DRAKAN_PREVIEW_DIR overrides); default = first spawn
;   spawn = x y z [yaw]   spawn point (at least 2); the server picks the one farthest from the other players
;   pickup = x y z sec [res=0x...] [name=Label]   respawning pickup; without res the level's own loose item nearest to
;                         (x, y, z) is adopted, with res that resource is spawned there (and at every respawn)

;   Authoring keys (the editor writes them; see netcode.md "Authoring keys"):
;   spawn = x y z [yaw] [team=1..4]                  team spawn (0 / omitted = any team)
;   marker = base|flag|zone x y z [radius=R] [team=N] [name=Label]   objective positions for custom modes
;   keep = x y z / remove = x y z                    per-object overrides of the world filter (authored, not read by the game yet)
;   modes = dm, tdm, <mode id>                       other ids name a [mode <id>] section
;
;   [mode <id>]           custom game mode (netcode.md "Custom game modes"): name, description, base = dm|tdm, teams,
;                         score_kill, score_death, score_objective, frag_limit, time_limit, respawn_delay, friendly_fire,
;                         start_health, loadout, weapons, objective = capture|hold [points=N] [seconds=N] [radius=N]

