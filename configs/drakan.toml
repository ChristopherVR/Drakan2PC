# scripts/buildtool/prepare_iso.py resolves owned ELF and private output paths.

[general]
# Path to input ELF file
input = "../build/local-game/SCES_500.06"

# Drakan: authoritative function boundaries + jump tables from Ghidra
functions_csv = "../analysis/functions.csv"
jump_tables_csv = "../analysis/jumptables.csv"
