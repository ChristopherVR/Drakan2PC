<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#100d0b">
  <script>try{var t=localStorage.getItem("drakan-theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t}catch(_){document.documentElement.dataset.theme="dark"}</script>
  <title>$title · Drakan2PC</title>
  <link rel="icon" href="$base/assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="$base/assets/site.css">
  <script src="$base/assets/site.js" defer></script>
</head>
<body data-base="$base" class="$page_class">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="$base/index.html" aria-label="Drakan2PC home"><img src="$base/assets/mark.svg" width="26" height="32" alt=""><span>Drakan<span class="brand-pc">2PC</span></span></a>
    <div class="header-actions">
      <a class="icon-button github-link" href="https://github.com/ChristopherVR/Drakan2PC" aria-label="Drakan2PC on GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
      <button class="icon-button theme-toggle" type="button" aria-label="Switch to light theme" title="Toggle light / dark theme"><svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
      <a class="install-button" href="$base/get-started.html">Install</a>
    </div>
  </header>
  $layout
  <footer class="site-footer"><span>Drakan2PC <span class="footer-divider">◆</span> An unofficial fan project.</span><span>Game and trademarks belong to their respective owners. <a href="https://github.com/ChristopherVR/Drakan2PC#legal-notice">Legal &amp; licences</a></span></footer>
  <dialog class="search-dialog" aria-labelledby="search-title">
    <div class="search-heading"><h2 id="search-title">Search documentation</h2><button class="search-close" type="button" aria-label="Close search">Close <kbd>Esc</kbd></button></div>
    <label class="sr-only" for="search-input">Search documentation</label>
    <input id="search-input" type="search" placeholder="Try “dual wield”, “subtitles” or “saves”…" autocomplete="off">
    <p id="search-status" role="status" aria-live="polite">Search player guides and developer documentation.</p>
    <ul id="search-results"></ul>
  </dialog>
  <dialog class="media-dialog" aria-label="Screenshot viewer">
    <button class="media-close" type="button" aria-label="Close screenshot">Close <kbd>Esc</kbd></button>
    <img alt="">
    <p class="media-description"></p>
  </dialog>
  $scripts
</body>
</html>
