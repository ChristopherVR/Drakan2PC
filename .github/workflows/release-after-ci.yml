name: Release after CI

# When every CI workflow that ran for a commit on main has finished green, and the commit holds release-worthy changes
# (feat, fix, perf or revert, see cliff.toml) since the last release, start the Release workflow with the next patch
# tag. A tag pushed with GITHUB_TOKEN would not start Release, so this dispatches release.yml instead.
# Manual releases (a v* tag push or a Release dispatch) still work and are unaffected.
on:
  workflow_run:
    workflows:
      - Build compiler tools (no game data)
      - Commit policy and release notes
      - Documentation and browser player
      - Editor assets
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read

# One decision at a time; a later completion waits, then finds the release already started and stops.
concurrency:
  group: release-after-ci
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A failed workflow never releases. workflow_dispatch evaluates the head of main.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          out() { echo "release=$1" >> "$GITHUB_OUTPUT"; echo "$2"; }

          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$SHA" ]; then
            out false "Skip: $SHA is not the head of main any more."; exit 0
          fi

          # Every check run of this commit must be finished and green (skipped and neutral are fine). The last
          # workflow to finish is the one that passes this gate. This job's own check run (named release) is excluded.
          pending=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "release" and .status != "completed")] | length')
          bad=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name != "release" and .status == "completed" and (.conclusion | IN("success","skipped","neutral") | not))] | length')
          if [ "$pending" != "0" ]; then out false "Skip: $pending check run(s) still running."; exit 0; fi
          if [ "$bad" != "0" ]; then out false "Skip: $bad check run(s) did not pass."; exit 0; fi

          # Newest release version from either tag style (older tags 0.1.3, 0.1.4 have no v prefix).
          last=$(git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)
          last=${last:-0.0.0}
          lasttag=$(git tag -l "$last" "v$last" | head -1)
          if [ -n "$lasttag" ] && [ "$(git rev-list -n1 "$lasttag")" = "$SHA" ]; then
            out false "Skip: $lasttag already points at $SHA."; exit 0
          fi

          range="HEAD"
          [ -n "$lasttag" ] && range="$lasttag..HEAD"
          if ! git log --format=%s "$range" | grep -qE '^(feat|fix|perf|revert)(\(|:)'; then
            out false "Skip: no feat, fix, perf or revert commits since ${lasttag:-the start}."; exit 0
          fi

          IFS=. read -r major minor patch <<< "$last"
          next="v$major.$minor.$((patch + 1))"
          # Either spelling counts as taken (0.1.4 and v0.1.4 are the same version).
          for t in "$next" "${next#v}"; do
            if git ls-remote --exit-code --tags origin "$t" > /dev/null 2>&1 \
               || gh release view "$t" > /dev/null 2>&1; then
              out false "Skip: version ${next#v} already exists as $t."; exit 0
            fi
          done
          if gh run list --workflow release.yml --limit 20 --json status,event,headSha \
               --jq '[.[] | select(.status != "completed" and .event == "workflow_dispatch")] | length' | grep -qv '^0$'; then
            out false "Skip: a Release run is already in progress."; exit 0
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          out true "Releasing $next from $SHA (last release ${lasttag:-none})."
      - name: Start the Release workflow
        if: steps.decide.outputs.release == 'true'
        run: gh workflow run release.yml --ref main -f tag="${{ steps.decide.outputs.tag }}"
