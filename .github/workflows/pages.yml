name: Documentation and browser player

# Publishes only generated documentation and the local-file launcher. No game build or data enters this job.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'scripts/buildtool/build_pages.py'
      - 'scripts/tests/test_build_pages.py'
      - 'runtime/web/pages/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'BUILDING.md'
      - 'scripts/buildtool/build_pages.py'
      - 'scripts/tests/test_build_pages.py'
      - 'runtime/web/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the documentation renderer
        run: python -m pip install -r docs/site/requirements.txt
      - name: Test the site builder and player compatibility
        run: python -m unittest discover -s scripts/tests -p test_build_pages.py
      - name: Build and validate public pages
        run: python scripts/buildtool/build_pages.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.repository == 'ChristopherVR/Drakan2PC'
        with:
          path: build/github-pages

  deploy:
    if: github.event_name != 'pull_request' && github.repository == 'ChristopherVR/Drakan2PC'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
