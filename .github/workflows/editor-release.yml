name: Editor assets

# Builds the two desktop apps of the editor workspace: the Drakan Editor (level / mod editor,
# editor/packages/desktop/src-tauri/tauri.conf.json) and the standalone Drakan Save Editor (tauri.save.conf.json overlay),
# and attaches them to the newest "Drakan PC" game release (a v* tag). There is no separate editor release.
#
#  - release.yml calls this workflow after it publishes a new v* release, so a game release carries editor builds of
#    the same commit.
#  - A push to main that touches editor/** (or a manual run) rebuilds the apps and replaces the editor assets on the
#    newest existing v* release, so the editor download always comes from the latest Drakan PC release.
#
# Asset names are fixed so replacing them (gh release upload --clobber) never leaves stale files behind:
#   DrakanEditor-Setup.exe, DrakanEditor-Portable.zip, DrakanSaveEditor-Setup.exe, DrakanSaveEditor-Portable.zip,
#   EDITOR-SHA256SUMS.txt (a separate checksum file, so release.yml's SHA256SUMS.txt is never overwritten).
# The apps contain no game data: they read the player's own disc image and saves at run time.
on:
  push:
    branches: [main]
    paths: ['editor/**', '.github/workflows/editor-release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the editor to (empty = the newest v* release)
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: Release to attach the editor to (empty = the newest v* release)
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build the editor apps and attach them to the Drakan PC release
    runs-on: windows-2022
    timeout-minutes: 75
    if: github.repository == 'ChristopherVR/Drakan2PC'
    # One refresh per release at a time; the newest request for a release replaces a queued older one.
    concurrency:
      group: editor-assets-${{ inputs.tag || 'latest' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # editor/packages/formats is a submodule (ChristopherVR/drakan-formats); npm ci and the build need it.
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Pick the Drakan PC release
        run: |
          $tag = $env:REQUESTED_TAG
          if (-not $tag) {
            # Newest published game release: v* tags only (never site-media-* or the legacy editor-b*).
            $releases = gh release list --limit 100 --exclude-drafts --json tagName,createdAt | ConvertFrom-Json
            $tag = $releases | Where-Object { $_.tagName -match '^v\d' } | Sort-Object { [datetime]$_.createdAt } -Descending |
              Select-Object -First 1 -ExpandProperty tagName
          }
          if (-not $tag) { Write-Warning 'No v* release exists yet; the editor is built and tested but not published.' }
          "TAG=$tag" >> $env:GITHUB_ENV
          # The version is the commit count, so it only ever grows and the installer upgrades older ones.
          $count = (git rev-list --count HEAD).Trim()
          "VERSION=0.1.$count" >> $env:GITHUB_ENV
          Write-Host "Release: $tag, editor version 0.1.$count"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install editor dependencies
        working-directory: editor
        run: npm ci
      - name: Test and type-check the editor
        working-directory: editor
        run: |
          npm test
          npm run build
      - name: Stamp the build version
        working-directory: editor/packages/desktop/src-tauri
        run: |
          $conf = Get-Content tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $env:VERSION
          $conf | ConvertTo-Json -Depth 32 | Set-Content tauri.conf.json -Encoding utf8NoBOM
      - name: Build the Drakan Editor
        working-directory: editor/packages/desktop
        run: |
          npx tauri build
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/out" | Out-Null
          $bundle = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $bundle -Filter '*.exe' | Move-Item -Destination "$env:GITHUB_WORKSPACE/out/DrakanEditor-Setup.exe"
          # By name: with a reused target dir the newest *.exe can be the save editor's.
          Compress-Archive -Path 'src-tauri/target/release/drakan-editor-desktop.exe' `
            -DestinationPath "$env:GITHUB_WORKSPACE/out/DrakanEditor-Portable.zip"
      # Native WebView2 check of the built exe (import dialog dropdown, mouse and keyboard; no disc needed). Reliable
      # locally (installed, portable, with and without a disc), not yet proven on the hosted runner, so it reports but
      # does not block the release. Make it blocking once a few runs passed.
      - name: WebView2 smoke test of the Drakan Editor
        continue-on-error: true
        timeout-minutes: 5
        working-directory: editor
        run: npm run smoke:webview -w @drakan/desktop
      - name: Build the Drakan Save Editor
        working-directory: editor/packages/desktop
        run: |
          npx tauri build --config src-tauri/tauri.save.conf.json
          $bundle = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $bundle -Filter '*.exe' | Move-Item -Destination "$env:GITHUB_WORKSPACE/out/DrakanSaveEditor-Setup.exe"
          Compress-Archive -Path 'src-tauri/target/release/drakan-save-editor.exe' `
            -DestinationPath "$env:GITHUB_WORKSPACE/out/DrakanSaveEditor-Portable.zip"
      - name: Attach the editor to the release
        if: env.TAG != ''
        run: |
          $out = "$env:GITHUB_WORKSPACE/out"
          $expected = 'DrakanEditor-Setup.exe', 'DrakanEditor-Portable.zip', 'DrakanSaveEditor-Setup.exe', 'DrakanSaveEditor-Portable.zip'
          foreach ($name in $expected) { if (-not (Test-Path -LiteralPath "$out/$name")) { throw "$name was not built" } }
          $lines = @("Drakan Editor $env:VERSION, commit $env:GITHUB_SHA")
          $lines += $expected | ForEach-Object { "$((Get-FileHash "$out/$_" -Algorithm SHA256).Hash.ToLower())  $_" }
          Set-Content -Encoding ascii "$out/EDITOR-SHA256SUMS.txt" $lines
          gh release view $env:TAG --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Release $env:TAG does not exist" }
          # Remove editor assets from older builds that used other names.
          $keep = $expected + 'EDITOR-SHA256SUMS.txt'
          $existing = (gh release view $env:TAG --json assets | ConvertFrom-Json).assets.name
          foreach ($name in $existing) {
            if ($name -match '^Drakan(Save)?Editor-' -and $keep -notcontains $name) { gh release delete-asset $env:TAG $name --yes }
          }
          gh release upload $env:TAG @($keep | ForEach-Object { "$out/$_" }) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed' }
          Write-Host "Attached the editor $env:VERSION to $env:TAG"
