name: Commit policy and release notes

# Every commit after the policy base must name the component it changes (game, editor, save-editor or repo) so the
# release notes generated by git-cliff (cliff.toml) can say what changed in each download. See scripts/commit_policy.py.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Commit messages and release-notes preview
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install git-cliff
        run: python -m pip install -r requirements-dev.txt
      - name: Check commit messages
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            python scripts/commit_policy.py --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi
          python scripts/commit_policy.py
      - name: Preview the next release notes
        run: |
          mkdir -p build
          git cliff --unreleased --tag vNEXT -o build/release-notes-preview.md
          cat build/release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
