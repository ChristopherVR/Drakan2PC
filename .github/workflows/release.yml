name: Release

# Builds DrakanPC-Setup.exe (and the zip builder kit) from the tagged commit and publishes them as a GitHub Release,
# then attaches the Drakan Editor and Save Editor builds of the same commit (editor-release.yml).
# Both contain source, build scripts and build tools only; the game is built on the player's PC from their own disc.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v1.0.0); the selected branch's head is released
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  installer:
    runs-on: windows-2022
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The kit packs the formats submodule's sources (character_motion.py needs them).
          submodules: recursive
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'Inno Setup 6 is not available' }
          "ISCC=$iscc" >> $env:GITHUB_ENV
      - name: Repository audit
        run: python scripts/repository_guard.py
      - name: Build the installer
        run: python scripts/buildtool/package_builder_kit.py --installer --iscc "$env:ISCC" --output-directory build/release
      - name: Build the zip kit
        run: python scripts/buildtool/package_builder_kit.py --output-directory build/release
      # Gate: the Setup builds the game on the player's PC from this tree, so a tree whose runtime does not compile
      # must never become a release. Compile the runtime sources from the packaged kit (a git archive of the tagged
      # commit, exactly what the player gets) in a clean directory. Compile only: no disc, no recompiler output.
      - name: Gate - the packaged kit's game runtime sources compile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $dirty = git status --porcelain --untracked-files=no
          if ($dirty) { $dirty; throw 'tracked files differ from the tagged commit' }
          $zip = (Get-ChildItem build/release -Filter 'DrakanPC-Builder-*.zip' | Select-Object -First 1).FullName
          Expand-Archive -LiteralPath $zip -DestinationPath build/kit-verify
          $kit = (Get-ChildItem build/kit-verify -Directory | Select-Object -First 1).FullName
          Push-Location $kit
          cmake --preset runtime-check
          cmake --build --preset runtime-check --parallel 4
          Pop-Location
      - name: Stage release files
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force build/publish
          Copy-Item (Get-ChildItem build/release -Filter 'DrakanPC-Setup-*.exe' | Select-Object -First 1).FullName (Join-Path $out 'DrakanPC-Setup.exe')
          Copy-Item (Get-ChildItem build/release -Filter 'DrakanPC-Builder-*.zip' | Select-Object -First 1).FullName (Join-Path $out 'DrakanPC-Builder.zip')
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Set-Content -Encoding ascii (Join-Path $out 'SHA256SUMS.txt')
      - name: Write the release notes
        shell: pwsh
        run: |
          # What changed in the game, the editor and the save editor since the previous v* release (cliff.toml), then
          # the standing download and install notes.
          python -m pip install -r requirements-dev.txt
          $PSNativeCommandUseErrorActionPreference = $false
          git rev-parse -q --verify "refs/tags/$env:TAG" *> $null
          $tagged = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($tagged) { git cliff --latest -o build/changes.md } else { git cliff --unreleased --tag $env:TAG -o build/changes.md }
          $notes = (Get-Content build/changes.md -Raw).Trim() + "`n`n" + (Get-Content scripts/buildtool/kit/RELEASE-NOTES.md -Raw)
          Set-Content -Encoding utf8NoBOM build/release-notes.md $notes
          Get-Content build/changes.md -Raw >> $env:GITHUB_STEP_SUMMARY
      - name: Publish the release
        shell: pwsh
        run: |
          $files = (Get-ChildItem build/publish -File).FullName
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $env:TAG *> $null
          $exists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($exists) {
            gh release upload $env:TAG @files --clobber
            gh release edit $env:TAG --notes-file build/release-notes.md
          } else {
            gh release create $env:TAG @files --title "Drakan PC $env:TAG" `
              --notes-file build/release-notes.md --target $env:GITHUB_SHA
          }
          # releases/latest/download/DrakanPC-Setup.exe (README, install guide) must resolve to a game release, never
          # to a newer site-media release.
          gh release edit $env:TAG --latest

  # The Drakan Editor and Drakan Save Editor are part of the Drakan PC release, built from the same commit. They run
  # after the release exists; if this job fails the game release is still published, so re-run only this job.
  # Editor changes between game releases refresh the same assets on the newest release (editor-release.yml).
  editor:
    needs: installer
    permissions:
      contents: write
    uses: ./.github/workflows/editor-release.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
